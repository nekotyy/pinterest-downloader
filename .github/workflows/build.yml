name: Build desktop app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test extension
        run: node tests/extension.test.js
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained application
        run: dotnet publish PinterestDownload.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/app
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse extension,extension-firefox,docs dist/
          Copy-Item README.md,ИНСТРУКЦИЯ.txt dist/
          Compress-Archive -Path dist/* -DestinationPath PinterestDownload-Windows.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp -r extension extension-firefox docs dist/
          cp README.md ИНСТРУКЦИЯ.txt dist/
          chmod +x dist/app/PinterestDownload
          tar -C dist -czf PinterestDownload-Linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: PinterestDownload-${{ matrix.name }}
          path: PinterestDownload-${{ matrix.name }}.*
